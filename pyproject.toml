[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phenonn"
version = "0.1.0"
description = "PhenoNN - phenology neural networks"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "Kazem Ardaneh", email = "kardaneh@ipsl.fr"},
    {name = "Stefan Barbu", email = "stefan.barbu@polytechnique.edu"},
    {name = "Esteban Carlin"}
]

license = {file = "LICENSE"}

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]

dependencies = [
    "mpltex>=0.7",
    "xarray>=2023.1.0",
    "netcdf4>=1.7.2",
    "h5netcdf>=1.1.0",
]

# FIX: Move version dynamic to tool.hatch section
[tool.hatch.version]
path = "phenonn/version.py"

# FIX: keep local-only symlinks (pixelset1, runs) and bulk data out of the sdist
[tool.hatch.build.targets.sdist]
exclude = [
  "pixelset1",
  "runs",
  "data",
  "PhenoNN Cleanup*.md",
]

[tool.hatch.build.targets.wheel]
packages = ["phenonn"]

# FIX: Scripts entry points - must be strings in format "command = module:function"
[project.scripts]
phenonn = "phenonn.cli:main"

# Optional: Add separate scripts if you want them
# phenonn-predict = "phenonn.cli:main_predict"
# phenonn-train = "phenonn.cli:main_train"
# phenonn-hp-tuning = "phenonn.cli:main_hp_tuning"

[project.urls]
Source = "https://github.com/kardaneh/PhenoNN"

[project.optional-dependencies]
full = [
    "numpy>=1.23",
    "pandas>=2.0.3",
    "matplotlib>=3.5",
    "torch>=2.0",
    "scipy>=1.10.1",
    "rich>=13.0",
    "tqdm>=4.65.1",
    "tensorboard>=2.14.0",
    "scikit-learn>=1.3.2",
    "dask>=2024.1.0",
]
dev = [
    "pre-commit>=3.5.0",
    "ruff>=0.5.0",
]

# Compatible with python 3.10+
#docs = [
#    "myst-parser>=3.0.1",
#    "sphinx>=7.1.2",
#    "sphinx-rtd-theme>=3.1.0",
#    "sphinx-copybutton>=0.5.0",
#    "sphinx-autodoc-typehints>=1.24.0",
#]

# Compatible with python 3.11
docs = [
    "sphinx>=7.3,<8.0",
    "myst-parser>=3.0.1,<4.0",
    "docutils>=0.18,<0.21",
    "sphinx-rtd-theme>=3.1.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-autodoc-typehints>=1.24.0",
]
